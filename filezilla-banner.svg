<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63333"/>
      <stop offset="100%" style="stop-color:#bf0000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff08" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
  </g>

  <!-- FileZilla "F" logo shape -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="18" height="200" fill="url(#red)" rx="3"/>
    <rect x="0" y="0" width="110" height="18" fill="url(#red)" rx="3"/>
    <rect x="0" y="88" width="85" height="18" fill="url(#red)" rx="3"/>
  </g>

  <!-- Title -->
  <text x="230" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">FileZilla FTP</text>
  <text x="232" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#e6333388">+ Analyse Wireshark</text>

  <!-- Packet visualization -->
  <g transform="translate(550, 80)">
    <!-- PC 1 -->
    <rect x="0" y="60" width="80" height="55" fill="#ffffff10" stroke="#e63333" stroke-width="1.5" rx="5"/>
    <text x="40" y="93" font-family="monospace" font-size="11" fill="#e63333" text-anchor="middle">PC Serveur</text>
    <text x="40" y="107" font-family="monospace" font-size="9" fill="#ffffff60" text-anchor="middle">FileZilla Server</text>

    <!-- PC 2 -->
    <rect x="240" y="60" width="80" height="55" fill="#ffffff10" stroke="#e63333" stroke-width="1.5" rx="5"/>
    <text x="280" y="93" font-family="monospace" font-size="11" fill="#e63333" text-anchor="middle">PC Client</text>
    <text x="280" y="107" font-family="monospace" font-size="9" fill="#ffffff60" text-anchor="middle">FileZilla Client</text>

    <!-- Arrow -->
    <line x1="82" y1="87" x2="238" y2="87" stroke="#e63333" stroke-width="2" stroke-dasharray="6,3"/>
    <polygon points="238,82 248,87 238,92" fill="#e63333"/>

    <!-- Packet label -->
    <text x="160" y="78" font-family="monospace" font-size="10" fill="#ffffff80" text-anchor="middle">PORT 21 — Non chiffré</text>

    <!-- Wireshark -->
    <rect x="90" y="170" width="140" height="45" fill="#00000040" stroke="#4488ff" stroke-width="1.5" rx="5"/>
    <text x="160" y="196" font-family="monospace" font-size="11" fill="#4488ff" text-anchor="middle">Wireshark</text>
    <text x="160" y="208" font-family="monospace" font-size="9" fill="#ffffff60" text-anchor="middle">Capture des paquets</text>
    <line x1="160" y1="170" x2="160" y2="115" stroke="#4488ff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="155,117 160,107 165,117" fill="#4488ff"/>

    <!-- Plaintext warning -->
    <rect x="40" y="235" width="240" height="30" fill="#e6333315" stroke="#e6333340" stroke-width="1" rx="4"/>
    <text x="160" y="254" font-family="monospace" font-size="10" fill="#e63333" text-anchor="middle">USER / PASS visibles en clair</text>
  </g>
</svg>
